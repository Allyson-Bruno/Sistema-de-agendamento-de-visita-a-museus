<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      lang="pt-BR">
<h:head>
    <title>Agendar visita</title>
</h:head>
<h:body>
    <h1>Agendar visita</h1>

    <h:form id="formAgendamento">
        <h:messages id="mensagens" />

        <div>
            <h:outputLabel for="museu" value="Museu" />
            <h:selectOneMenu id="museu" value="#{agendamentoBean.museuId}">
                <f:selectItem itemLabel="Selecione um museu"
                              noSelectionOption="true" />
                <f:selectItems value="#{agendamentoBean.museus}" />
                <f:ajax execute="@this" render="painelHorario mensagens"
                        listener="#{agendamentoBean.carregarHorarios}"
                        resetValues="true" />
            </h:selectOneMenu>
        </div>

        <div>
            <h:outputLabel for="data" value="Data da visita" />
            <h:inputText id="data" value="#{agendamentoBean.dataInformada}"
                         pt:type="date" required="true"
                         requiredMessage="Informe a data da visita." />
        </div>

        <h:panelGroup id="painelHorario" layout="block">
            <h:outputLabel for="horario" value="Horário" />
            <h:selectOneMenu id="horario" value="#{agendamentoBean.horarioId}"
                             disabled="#{empty agendamentoBean.horarios}">
                <f:selectItem itemLabel="Selecione um horário"
                              noSelectionOption="true" />
                <f:selectItems value="#{agendamentoBean.horarios}" var="horario"
                               itemValue="#{horario.id}"
                               itemLabel="#{horario.horaInicio}" />
            </h:selectOneMenu>
        </h:panelGroup>

        <h:commandButton value="Validar seleção" action="#{agendamentoBean.validarSelecao}" />
    </h:form>
</h:body>
</html>
